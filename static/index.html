<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>建筑抗震鉴定与加固排序</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;max-width:980px;margin:2rem auto;padding:0 1rem;color:#17212b}
h1{margin-bottom:.2rem}
.bar{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;margin:1rem 0;padding:.6rem .8rem;background:#f4f7f9;border-radius:6px}
.bar label{font-size:.9rem}
input,select,textarea,button{font:inherit;padding:.4rem .6rem}
button{cursor:pointer}
.item{border:1px solid #d7dee5;border-radius:8px;padding:.8rem 1rem;margin:.8rem 0}
.item h3{margin:.2rem 0}
.muted{color:#5b6b7a;font-size:.85rem}
.blocked{color:#b42318;font-weight:600}
.ok{color:#067647;font-weight:600}
table{width:100%;border-collapse:collapse;margin-top:.5rem;font-size:.9rem}
th,td{border:1px solid #e2e8ef;padding:.4rem .5rem;text-align:left;vertical-align:top}
th{background:#f4f7f9}
.tag{display:inline-block;padding:.05rem .5rem;border-radius:999px;font-size:.78rem}
.tag-open{background:#fef3f2;color:#b42318}
.tag-closed{background:#ecfdf3;color:#067647}
.evts{font-size:.8rem;color:#5b6b7a;margin:.2rem 0 0;padding-left:1rem}
textarea{width:100%;box-sizing:border-box}
.row{display:flex;gap:.4rem;align-items:flex-start;flex-wrap:wrap;margin-top:.3rem}
.msg{margin:.4rem 0;font-size:.9rem}
.msg.err{color:#b42318}.msg.okmsg{color:#067647}
</style>
</head>
<body>
<h1>建筑抗震鉴定与加固排序</h1>
<p class="muted">依据结构、用途、人员密度和历史缺陷生成鉴定与加固优先级。复核事项由评估员或结构工程师提交处理说明后关闭；审核委员会可注明原因重开；所有处置都会推进项目版本，仍有未关闭待办时无法验收。</p>

<div class="bar">
  <label>身份 <input id="actor" value="demo" size="10"></label>
  <label>角色
    <select id="role">
      <option value="assessor">assessor 评估员</option>
      <option value="structural_engineer">structural_engineer 结构工程师</option>
      <option value="review_board" selected>review_board 审核委员会</option>
      <option value="viewer">viewer 查看者</option>
    </select>
  </label>
  <button onclick="loadAll()">刷新</button>
  <label><input type="checkbox" id="onlyBlockers"> 只看挡住验收的项目</label>
  <span id="msg"></span>
</div>

<div id="items"></div>

<script>
const $=id=>document.getElementById(id);
function headers(){return {'Content-Type':'application/json','X-Actor':$('actor').value.trim()||'demo','X-Role':$('role').value};}
function setMsg(t,ok){const m=$('msg');m.textContent=t;m.className='msg '+(ok?'okmsg':'err');if(t)setTimeout(()=>{m.textContent='';m.className='msg'},4000);}
async function api(method,path,body){
  const r=await fetch(path,{method,headers:headers(),body:body?JSON.stringify(body):undefined});
  const data=await r.json().catch(()=>({}));
  if(!r.ok)throw Object.assign(new Error(data.message||('HTTP '+r)),data);
  return data;
}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

async function loadAll(){
  try{
    const {items}=await api('GET','/api/items');
    const only=$('onlyBlockers').checked;
    const list=only?items.filter(i=>i.acceptance_blocked):items;
    $('items').innerHTML=list.length?list.map(renderItem).join(''):'<p class="muted">没有符合条件的项目。</p>';
    for(const it of list) await loadRecords(it.id);
  }catch(e){setMsg(e.message);}
}

function renderItem(it){
  const state=it.acceptance_blocked
    ? `<span class="blocked">验收被 ${it.open_record_count} 个待办挡住</span>`
    : `<span class="ok">无待办阻挡（版本 v${it.version}）</span>`;
  return `<div class="item" id="item-${it.id}">
    <h3>#${it.id} ${esc(it.title)} <span class="muted">[${esc(it.status)} v${it.version}]</span></h3>
    <div class="muted">优先级 ${it.priority} · 期限 ${it.deadline_hours}h · 需升级 ${it.escalation_required?'是':'否'} · ${state}</div>
    <div id="records-${it.id}">加载事项中…</div>
  </div>`;
}

async function loadRecords(iid){
  try{
    const {records}=await api('GET',`/api/items/${iid}/records?status=open`);
    const box=$(`records-${iid}`);
    if(!box)return;
    if(!records.length){box.innerHTML='<p class="muted ok">无挡住验收的待办事项。</p>';return;}
    box.innerHTML='<p class="muted">仍挡住验收的事项：</p><table><tr><th>编号</th><th>类型/描述</th><th>处置</th></tr>'
      +records.map(r=>`<tr>
          <td>${r.id}</td>
          <td><span class="tag tag-open">待办</span> ${esc(r.kind)}<br><span class="muted">${esc(r.detail)}</span></td>
          <td>
            <textarea id="note-${iid}-${r.id}" rows="2" placeholder="处理说明（关闭）/ 重开原因"></textarea>
            <div class="row">
              <button onclick="dispose(${iid},${r.id},'close')">提交处理说明并关闭</button>
              <button onclick="dispose(${iid},${r.id},'reopen')">委员会重开</button>
            </div>
            ${r.events&&r.events.length?`<ul class="evts">${r.events.map(e=>`<li>${e.action==='close'?'关闭':'重开'}：${esc(e.note)}（${esc(e.actor)} @ ${esc(e.created_at)}）</li>`).join('')}</ul>`:''}
          </td>
        </tr>`).join('')+'</table>';
  }catch(e){const box=$(`records-${iid}`);if(box)box.innerHTML=`<p class="msg err">${esc(e.message)}</p>`;}
}

async function dispose(iid,rid,action){
  const note=$(`note-${iid}-${rid}`).value.trim();
  if(!note){setMsg(action==='close'?'处理说明不能为空':'重开原因不能为空');return;}
  try{
    const r=await api('POST',`/api/items/${iid}/records/${rid}/dispose`,{action,note});
    setMsg(`事项 ${rid} 已${action==='close'?'关闭':'重开'}，项目版本 v${r.item_version}`,true);
    loadAll();
  }catch(e){setMsg(e.message);}
}

loadAll();
</script>
</body>
</html>
